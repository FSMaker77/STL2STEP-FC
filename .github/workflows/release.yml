name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer + portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis mingw-w64 unzip zip imagemagick

      - name: Build Windows packages
        env:
          PYC_PYTHON: python3
        run: |
          chmod +x packaging/windows/build_windows.sh packaging/windows/build_portable_zip.sh
          ./packaging/windows/build_windows.sh
          ./packaging/windows/build_portable_zip.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync imagemagick patchelf

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x build.sh packaging/build_appimage.sh
          ./build.sh
          ./packaging/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          for f in *; do
            case "$f" in
              *.sha256|SHA256SUMS.txt) continue ;;
            esac
            sha256sum "$f" > "$f.sha256"
          done
          : > SHA256SUMS.txt
          for f in *; do
            case "$f" in
              *.sha256|SHA256SUMS.txt) continue ;;
            esac
            sha256sum "$f" >> SHA256SUMS.txt
          done
          ls -lh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          sed "s/@VERSION@/${VERSION}/g" .github/release-notes.md > release-notes.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "STL2STEP FC ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "STL2STEP FC ${VERSION}" --notes-file release-notes.md
          fi
          gh release upload "$TAG" dist/* --clobber
