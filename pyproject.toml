[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stl2step"
version = "0.2.2"
description = "Convert STL meshes (3D printing) into editable STEP CAD models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "STL2STEP contributors" }]
keywords = ["stl", "step", "cad", "3d-printing", "mesh", "converter", "opencascade"]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "PySide6>=6.6",
    "cadquery-ocp>=7.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stl2step = "stl2step.cli:main"
stl2step-gui = "stl2step.gui.app:main"

[tool.setuptools]
packages = [
    "stl2step",
    "stl2step.core",
    "stl2step.gui",
    "stl2step.profiles",
]

[tool.setuptools.package-data]
"stl2step" = ["data/profiles/*.json", "data/splash.png"]
